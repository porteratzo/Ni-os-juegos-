[project]
name = "kidsar"
version = "0.1.0"
description = "Ninos Juegos: AR party game vision service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "websockets"]
redis = ["redis>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kidsar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
